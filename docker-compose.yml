services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docuscope
      POSTGRES_PASSWORD: docuscope
      POSTGRES_DB: docuscope
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuscope"]
      interval: 5s
      timeout: 5s
      retries: 10
