<svg width="100%" viewBox="242 134 192 148" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Move folder icon</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A folder icon with a right-facing arrow badge in the bottom right corner, representing a move action</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Folder back tab -->
  <path d="M250 162 L250 148 Q250 142 256 142 L308 142 Q316 142 320 150 L328 162 Z" fill="var(--color-background-warning)" stroke="var(--color-border-warning)" stroke-width="1.5" style="fill:rgb(246, 238, 223);stroke:rgb(128, 92, 31);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Folder body -->
  <rect x="250" y="162" width="180" height="116" rx="8" fill="var(--color-background-warning)" stroke="var(--color-border-warning)" stroke-width="1.5" style="fill:rgb(246, 238, 223);stroke:rgb(128, 92, 31);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Folder body sheen / inner shadow line -->
  <line x1="250" y1="176" x2="430" y2="176" stroke="var(--color-border-warning)" stroke-width="1" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(128, 92, 31);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Arrow badge circle -->
  <circle cx="400" cy="248" r="26" fill="var(--color-text-warning)" opacity="0.15" stroke="var(--color-text-warning)" stroke-width="1.5" style="fill:rgb(90, 72, 21);stroke:rgb(90, 72, 21);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.15;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="400" cy="248" r="26" fill="var(--color-background-primary)" stroke="var(--color-text-warning)" stroke-width="2" style="fill:rgb(255, 255, 255);stroke:rgb(90, 72, 21);color:rgb(0, 0, 0);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Arrow inside badge -->
  <line x1="386" y1="248" x2="410" y2="248" stroke="var(--color-text-warning)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)" style="fill:rgb(0, 0, 0);stroke:rgb(90, 72, 21);color:rgb(0, 0, 0);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</svg>